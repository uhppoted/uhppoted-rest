# paths/door-firstcard.yaml

put:
  tags:
    - device, controller
  summary: "Configures first-card configuration for a door"
  description: "Sets the first-card weekdays, times and modes for a door"
  operationId: putFirstCard
  parameters:
    - name: device-id
      in: path
      description: "Controller serial number"
      required: true
      schema:
        type: integer
        format: uint32
        example: 405419896
    - name: door
      in: path
      description: "Door number"
      required: true
      schema:
        type: integer
        format: uint8
        example: 3
  requestBody:
    description: "First card"
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/FirstCard"
  responses:
    '200':
      description: "First card configured ok"
      content:
        application/json:
          schema:
              $ref: "#/components/schemas/FirstCard"
    '404':
      description: "No controller with ID matching device-id"
      content:
        application/json:
          schema:
              $ref: "#/components/schemas/Error"
    '405':
      description: "Invalid request"
      content:
        application/json:
          schema:
              $ref: "#/components/schemas/Error"
    '500':
      description: "Internal system error"
      content:
        application/json:
          schema:
              $ref: "#/components/schemas/Error"
    default:
      description: "Request failed"
      content:
        application/json:
          schema:
              $ref: "#/components/schemas/Error"

# schemas/DeviceStatus.yaml

required: 
  - door-state 
  - door-buttons
  - system-state
  - system-datetime
  - packet-number
  - backup-state
  - special-message
  - battery-status
  - fire-alarm-status
  - event
properties:
  door-state:  
    type: object
    additionalProperties:
      type: boolean
      description: "true if the door is open"
    format: map[uint8]boolean
    description: "maps door number 1..4 to the corresponding door open/closed state"
    example: { 
      "1": true, 
      "2": false, 
      "3": false, 
      "4": true 
    }
  door-buttons:  
    type: object
    additionalProperties:
      type: boolean
      description: "true if the button for the door is pressed"
    description: "maps door number 1..4 to the corresponding door button pressed/released state"
    example: { 
      "1": true, 
      "2": true, 
      "3": false, 
      "4": true 
    }
  system-state:  
    type: integer
    format: uint8
    description: "System state flag set"
    example: 0
  system-datetime:  
    type: string
    format: yyyy-mm-dd HH:mm:ss
    description: "Current system date and time"
    example: "2023-03-28 15:32:29"
  packet-number:  
    type: integer
    format: uint8
    description: "Packet number, whatever that entails"
    example: 0
  backup-state:  
    type: integer
    format: uint8
    description: "Backup state code, whatever that entails"
    example: 0
  special-message:  
    type: integer
    format: uint8
    description: "Special message code, whatever that entails"
    example: 0
  battery-status:  
    type: integer
    format: uint8
    description: "Battery status flag set"
    example: 0
  fire-alarm-status:  
    type: integer
    format: uint8
    description: "Fire alarm status flag set"
    example: 0
  event:
    $ref: "./StatusEvent.yaml"

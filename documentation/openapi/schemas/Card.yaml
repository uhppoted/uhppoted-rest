# schemas/Card.yaml

required: 
  - card-number
  - start-date
  - end-date
  - doors
  - PIN
properties:
  card-number:  
    type: number
    format: uint32
    description: "Card number"
    example: 10058400
  start-date:  
    type: string
    format: yyyy-MM-dd
    description: "First date card is valid"
    example: "2023-01-01"
  end-date:  
    type: string
    format: yyyy-MM-dd
    description: "Last date card is valid"
    example: "2023-12-31"
  doors:  
    type: object
    additionalProperties:
      oneOf:
        - type: boolean
          description: "Enable/disable door access"
        - type: integer
          minimum: 0
          maximum: 254
          description: "Door access permission (0:none, 1:24x7, 2-254:timezone"
    description: "List of doors and access permissions"
  PIN:  
    type: number
    format: uint32
    description: "(optional) keypad PIN code in the range 0 to 999999"
    example: 7531